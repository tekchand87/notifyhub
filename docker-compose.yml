services:
  redis:
    image: redis:7.4-alpine
    container_name: notifyhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - notifyhub_redis_data:/data

  mongodb:
    image: mongo:8
    container_name: notifyhub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: notifyhub
      MONGO_INITDB_ROOT_PASSWORD: notifyhub_password
      MONGO_INITDB_DATABASE: notifyhub
    volumes:
      - notifyhub_mongodb_data:/data/db
      # mongo-keyfile is generated once via: openssl rand -base64 756 > mongo-keyfile && chmod 400 mongo-keyfile
      # MongoDB 8 requires a keyFile when --auth and --replSet are used together.
      # The file is gitignored; regenerate it on every fresh checkout.
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    # Run as a single-node replica set.
    # MongoDB multi-document ACID transactions (required by the Outbox pattern)
    # are only available in replica set mode. A single-node replica set provides
    # exactly the same data guarantees as standalone mode for development,
    # with full transaction support enabled.
    command: mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile

  # One-shot container that initializes the replica set on first boot.
  # It waits for the MongoDB node to be ready, then runs rs.initiate().
  # After successful initialization it exits cleanly.
  # The "restart: on-failure" policy ensures it retries if MongoDB isn't ready yet.
  mongo-init:
    image: mongo:8
    container_name: notifyhub-mongo-init
    restart: on-failure
    depends_on:
      - mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: notifyhub
      MONGO_INITDB_ROOT_PASSWORD: notifyhub_password
    volumes:
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    entrypoint: [
      "bash", "-c",
      "echo 'Waiting for MongoDB...' && sleep 8 && mongosh 'mongodb://notifyhub:notifyhub_password@mongodb:27017/admin?authSource=admin' --eval 'try { rs.status(); print(\"already initialized\"); } catch(e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongodb:27017\" }] }); print(\"initialized\"); }'"
    ]

  kafka:
    image: apache/kafka:4.0.1
    container_name: notifyhub-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6

    volumes:
      - notifyhub_kafka_data:/var/lib/kafka/data

volumes:
  notifyhub_redis_data:
  notifyhub_mongodb_data:
  notifyhub_kafka_data:
