services:
  redis:
    image: redis:7.4-alpine
    container_name: notifyhub-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - notifyhub_redis_data:/data
    networks:
      - notifyhub
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mongodb:
    image: mongo:8
    container_name: notifyhub-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: notifyhub
      MONGO_INITDB_ROOT_PASSWORD: notifyhub_password
      MONGO_INITDB_DATABASE: notifyhub
    volumes:
      - notifyhub_mongodb_data:/data/db
      # Generate once for a fresh checkout:
      # openssl rand -base64 756 > mongo-keyfile && chmod 400 mongo-keyfile
      # MongoDB 8 requires a keyFile when --auth and --replSet are combined.
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    command: mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile
    networks:
      - notifyhub
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot local provisioning step. The application and worker only validate
  # topics; this Compose helper owns local topic creation.
  mongo-init:
    image: mongo:8
    container_name: notifyhub-mongo-init
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: notifyhub
      MONGO_INITDB_ROOT_PASSWORD: notifyhub_password
    volumes:
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    entrypoint: ["bash", "-ec"]
    command:
      - |
        until mongosh --quiet "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/admin?authSource=admin" --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; do
          echo "Waiting for MongoDB readiness..."
          sleep 1
        done
        mongosh "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/admin?authSource=admin" --eval 'try { rs.status(); print("already initialized"); } catch(e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }); print("initialized"); }'
    networks:
      - notifyhub

  kafka:
    image: apache/kafka:4.0.1
    container_name: notifyhub-kafka
    restart: unless-stopped
    ports:
      # Host tools use localhost:9092. Containers use kafka:29092.
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Separate internal and host listeners. Advertising localhost to a
      # container causes the container to connect to itself, not this broker.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - notifyhub_kafka_data:/var/lib/kafka/data
    networks:
      - notifyhub
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Local topic provisioning remains separate from the worker so the worker
  # retains its production rule: validate topics, never create or alter them.
  kafka-init:
    image: apache/kafka:4.0.1
    container_name: notifyhub-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-notifyhub.events}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-notifyhub.events.dlq}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
      KAFKA_DLQ_TOPIC_PARTITIONS: ${KAFKA_DLQ_TOPIC_PARTITIONS:-1}
    entrypoint: ["bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_TOPIC}" --partitions "$${KAFKA_TOPIC_PARTITIONS}" --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_DLQ_TOPIC}" --partitions "$${KAFKA_DLQ_TOPIC_PARTITIONS}" --replication-factor 1
    networks:
      - notifyhub

  backend:
    image: notifyhub-backend:local
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: notifyhub-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      # These values deliberately override host-local endpoints from .env.
      NODE_ENV: ${DOCKER_NODE_ENV:-development}
      PORT: 3000
      MONGODB_URI: mongodb://notifyhub:notifyhub_password@mongodb:27017/notifyhub?authSource=admin&directConnection=true
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_SSL: "false"
      KAFKA_SASL_MECHANISM: ""
      KAFKA_SASL_USERNAME: ""
      KAFKA_SASL_PASSWORD: ""
      KAFKA_TOPIC: ${KAFKA_TOPIC:-notifyhub.events}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-notifyhub.events.dlq}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
      KAFKA_DLQ_TOPIC_PARTITIONS: ${KAFKA_DLQ_TOPIC_PARTITIONS:-1}
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - notifyhub
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: notifyhub-worker:local
    build:
      context: ./Backend
      dockerfile: Dockerfile.worker
    container_name: notifyhub-worker
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: ${DOCKER_NODE_ENV:-development}
      MONGODB_URI: mongodb://notifyhub:notifyhub_password@mongodb:27017/notifyhub?authSource=admin&directConnection=true
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_SSL: "false"
      KAFKA_SASL_MECHANISM: ""
      KAFKA_SASL_USERNAME: ""
      KAFKA_SASL_PASSWORD: ""
      KAFKA_TOPIC: ${KAFKA_TOPIC:-notifyhub.events}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-notifyhub.events.dlq}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
      KAFKA_DLQ_TOPIC_PARTITIONS: ${KAFKA_DLQ_TOPIC_PARTITIONS:-1}
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - notifyhub
    stop_grace_period: 45s

volumes:
  notifyhub_redis_data:
  notifyhub_mongodb_data:
  notifyhub_kafka_data:

networks:
  notifyhub:
    name: notifyhub
    driver: bridge
