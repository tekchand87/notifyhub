# NotifyHub temporary/demo Kafka broker for a single EC2 instance.
#
# This file is intentionally separate from docker-compose.yml. It runs only
# Kafka on the EC2 host, keeps broker data in a named Docker volume, and
# exposes only the client listener on TCP 9092. The controller listener and
# internal Docker listener are not published on the EC2 host.
services:
  kafka:
    image: apache/kafka:4.0.1
    container_name: notifyhub-kafka-ec2
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Container-to-container traffic uses kafka:29092. Clients outside this
      # EC2 host use the address supplied through KAFKA_PUBLIC_HOST.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_PUBLIC_HOST:?Set KAFKA_PUBLIC_HOST in the EC2 env file}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-broker demo settings. Do not use this replication model for
      # production-critical Kafka data.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}

    volumes:
      - notifyhub_kafka_ec2_data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  notifyhub_kafka_ec2_data:
